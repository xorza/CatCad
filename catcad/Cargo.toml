[package]
name = "catcad"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aperture3d.workspace = true
glam = { workspace = true, features = ["f64"] }
palantir.workspace = true
rfd.workspace = true
ron.workspace = true
serde.workspace = true
silverpoint.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
image.workspace = true
palantir = { workspace = true, features = ["internals", "golden"] }
# For emptying a `Batch` by hand, which the visual harness does to stage a
# scene and the application never does — it refills.
aperture3d = { workspace = true, features = ["internals"] }
# The crate on itself, to turn `internals` on for its own test targets and
# nowhere else. An integration test links the library built normally —
# `cfg(test)` is set only for the crate's own unit tests — so the reach-ins it
# needs have to arrive as a feature. Dev-dependency features are resolved only
# when building tests, which is what keeps them out of `cargo build` and out of
# what a host linking this crate is given.
catcad = { path = ".", features = ["internals"] }
# The allocation-test harness the `alloc` target below drives.
common = { workspace = true, features = ["internals"] }

[features]
default = ["quiet"]
quiet = ["tracing/release_max_level_info"]

# The reach-ins a harness needs and a program running the app does not: the
# renderer behind the view, the camera without a pointer to turn it with, what
# the pointer is over, and which tool is in hand. Off by default, so what the
# crate publishes is what a host actually calls.
internals = []

# Its own target because `CountingAllocator` has to be *the* allocator of the
# binary that runs. Ordinary `#[test]` functions inside it, so cargo names each
# gate and runs them the way it runs the rest. No `required-features`: the
# `internals` it reaches through arrives from the dev-dependency above, so a
# bare `cargo test` runs the gates rather than silently skipping them.
[[test]]
name = "alloc"
path = "tests/alloc/main.rs"

# The frames the app actually draws, measured and compared against goldens.
# Needs a GPU, so it is its own target rather than a unit test. No
# `required-features`: the `internals` it reaches through arrives from the
# dev-dependency above, so a bare `cargo test` runs the goldens rather than
# silently skipping them.
[[test]]
name = "visual"
path = "tests/visual/main.rs"

[lints]
workspace = true
