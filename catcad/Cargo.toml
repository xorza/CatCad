[package]
name = "catcad"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aperture3d.workspace = true
glam = { workspace = true, features = ["f64"] }
palantir.workspace = true
ron.workspace = true
serde.workspace = true
silverpoint.workspace = true
common = { workspace = true, optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
palantir = { workspace = true, features = ["internals", "golden"] }
# For emptying a `Batch` by hand, which the visual harness does to stage a
# scene and the application never does — it refills.
aperture3d = { workspace = true, features = ["internals"] }
# The crate on itself, to turn `internals` on for its own test targets and
# nowhere else. An integration test links the library built normally — `cfg(test)`
# is set only for the crate's own unit tests — so the reach-ins it needs have to
# arrive as a feature. Dev-dependency features are resolved only when building
# tests, which is what keeps them out of `cargo build` and out of what a host
# linking this crate is given.
catcad = { path = ".", features = ["internals"] }

[features]
# The reach-ins a harness needs and a program running the app does not: the
# renderer behind the view, and the camera without a pointer to turn it with.
# Off by default, so what the crate publishes is what a host actually calls.
internals = []

# Compiles the allocation-bench driver in `src/` and exposes the one call
# `tests/alloc.rs` makes. Carries `palantir/internals` because the driver
# raises the app through `UiHarness`, the same reach-in the tests use — the
# bench has to record real frames, not a stand-in for them.
bench = ["dep:common", "common/bench", "palantir/internals"]

# Its own target because `dhat::Alloc` has to be *the* global allocator, which
# is process-wide — anything sharing the binary pays a 10-30x allocator tax. A
# test rather than a bench because that isolation is per *binary*, and an
# integration test is one: what the bench profile bought was `lto = "fat"` and a
# single codegen unit, which cost a minute of build for a measurement that
# counts allocations rather than timing them.
[[test]]
name = "alloc"
harness = false
required-features = ["bench"]

# The frames the app actually draws, measured and compared against goldens.
# Needs a GPU, so it is its own target rather than a unit test. No
# `required-features`: the `internals` it reaches through arrives from the
# dev-dependency above, so a bare `cargo test` runs the goldens rather than
# silently skipping them.
[[test]]
name = "visual"
path = "tests/visual/main.rs"

[lints]
workspace = true
