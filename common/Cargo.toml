[package]
name = "common"
description = "Small things more than one crate in this workspace needs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Internal: it exists so the workspace's crates don't each carry their own copy
# of the same scaffolding, and has no meaning outside it.
publish = false

[dependencies]
backtrace = { workspace = true, optional = true }

[features]
# The allocation-test harness. Off by default, so a crate reaching here for
# anything else builds no stack capture it has no use for — and so this crate
# says out loud that it is scaffolding for test targets, which is the only
# place it is ever depended on from.
internals = ["dep:backtrace"]

[lints]
workspace = true
