[workspace]
resolver = "3"
members = [
    "aperture3d",
    "catcad",
    "common",
    "palantir",
    "palantir/anim-derive",
    "silverpoint",
]
default-members = ["catcad"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["xxorza <xxorza@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/xorza/CatCad"

[workspace.dependencies]
aperture3d = { path = "aperture3d" }
common = { path = "common" }
palantir = { path = "palantir" }
silverpoint = { path = "silverpoint" }
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.33", default-features = false, features = ["std"] }
wgpu = { version = "30.0", default-features = false, features = ["std", "wgsl"] }
dashu-base = { version = "0.6", default-features = false, features = ["std"] }
dashu-ratio = { version = "0.6", default-features = false, features = ["std"] }
ron = "0.12"
serde = { version = "1.0", features = ["derive"] }
rfd = "0.17"
# Resolved lazily, only where an allocation test fails: `common`'s counting
# allocator captures an unresolved stack per allocation inside a measured
# window, so a gate that trips names the line that allocated.
backtrace = "0.3"
# PNG alone, for the golden-image suite: the goldens are written and read back
# in one format, and every other codec would be a decoder nothing decodes.
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.bench]
debug = "line-tables-only"
opt-level = 3
strip = "none"
split-debuginfo = "off"
lto = "fat"
codegen-units = 1

[profile.release]
debug = "line-tables-only"
opt-level = 3
strip = "none"
split-debuginfo = "off"

[profile.release-max]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.dev.package."*"]
opt-level = 3

# `objc2` verifies every Objective-C message send against the runtime's own
# method signature, which parses a type encoding and allocates — behind each
# `MTLRenderCommandEncoder` call, so a frame pays it a few hundred times. That
# put `aperture3d`'s two paint gates 36 and 39 blocks/run over limits authored
# where objc2 is not in the graph at all; without it they measure 90 and 93
# against 102 and 106, so the two backends agree about what a frame costs.
[profile.dev.package.objc2]
debug-assertions = false
