[workspace]
resolver = "3"
members = [
    "aperture3d",
    "catcad",
    "common",
    "palantir",
    "palantir/anim-derive",
    "silverpoint",
]
default-members = ["catcad"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["xxorza <xxorza@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/xorza/CatCad"

[workspace.dependencies]
aperture3d = { path = "aperture3d" }
common = { path = "common" }
palantir = { path = "palantir" }
silverpoint = { path = "silverpoint" }
# Pinned to palantir's versions: `GpuInitCtx` hands out a `wgpu::Device`, so a
# second semver-incompatible wgpu would make that a foreign type.
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.33", default-features = false, features = ["std"] }
wgpu = { version = "30.0", default-features = false, features = ["std", "wgsl"] }
# The document format. `serde` is palantir's already and so is in the graph
# whatever this says; what `ron` adds is the backend it is written through —
# text that takes comments, and that writes a Rust enum as itself rather than
# as the tagged object JSON would make of one.
ron = "0.12"
serde = { version = "1.0", features = ["derive"] }
# `common`'s to depend on; every other member reaches dhat through it.
# Pinned to palantir's version so the workspace resolves one copy —
# `dhat::Alloc` is a global allocator, and two of them would be two profilers
# fighting over the same process.
dhat = "0.3"

[workspace.lints.rust]
missing_debug_implementations = "deny"
unreachable_pub = "deny"

# Profiles only take effect at the workspace root, so palantir's own tuning is
# restated here — its renderer and shaper are unusable at opt-level 0.
[profile.bench]
debug = true
opt-level = 3
strip = "none"
split-debuginfo = "off"
lto = "fat"
codegen-units = 1

[profile.release]
debug = true
opt-level = 3
strip = "none"
split-debuginfo = "off"

[profile.release-max]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

# `"*"` is every package that isn't a workspace member, so workspace code keeps
# its debug build while the dependency graph stays optimized.
[profile.dev.package."*"]
opt-level = 3

# `objc2` verifies every Objective-C message send against the runtime's own
# method signature, which parses a type encoding and allocates — behind each
# `MTLRenderCommandEncoder` call, so a frame pays it a few hundred times. That
# put `aperture3d`'s two paint gates 36 and 39 blocks/run over limits authored
# where objc2 is not in the graph at all; without it they measure 90 and 93
# against 102 and 106, so the two backends agree about what a frame costs.
#
# Off rather than measured around, because a dependency is built once for the
# whole of `cargo build` and `cargo test` alike — there is no scope that could
# hold it for one and not the other. What is given up is a check on calls
# `wgpu-hal` makes and this workspace does not, on the one platform objc2
# compiles on.
[profile.dev.package.objc2]
debug-assertions = false
