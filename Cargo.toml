[workspace]
resolver = "3"
members = ["aperture3d", "catcad", "palantir", "palantir/anim-derive", "silverpoint"]
default-members = ["catcad"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["xxorza <xxorza@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/xorza/CatCad"

[workspace.dependencies]
aperture3d = { path = "aperture3d", version = "0.1" }
palantir = { path = "palantir", version = "0.3" }
silverpoint = { path = "silverpoint", version = "0.1" }
# Pinned to palantir's versions: `GpuInitCtx` hands out a `wgpu::Device`, so a
# second semver-incompatible wgpu would make that a foreign type.
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.33", default-features = false, features = ["std"] }
wgpu = { version = "30.0", default-features = false, features = ["std", "wgsl"] }
# The allocation benches only; each member marks it optional behind its own
# `bench` feature. Pinned to palantir's version so the workspace resolves one
# copy — `dhat::Alloc` is a global allocator, and two of them would be two
# profilers fighting over the same process.
dhat = "0.3"

[workspace.lints.rust]
missing_debug_implementations = "deny"
unreachable_pub = "deny"

# Profiles only take effect at the workspace root, so palantir's own tuning is
# restated here — its renderer and shaper are unusable at opt-level 0.
[profile.bench]
debug = true
opt-level = 3
strip = "none"
split-debuginfo = "off"
lto = "fat"
codegen-units = 1

[profile.release]
debug = true
opt-level = 3
strip = "none"
split-debuginfo = "off"

[profile.release-max]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

# `"*"` is every package that isn't a workspace member, so workspace code keeps
# its debug build while the dependency graph stays optimized.
[profile.dev.package."*"]
opt-level = 3
