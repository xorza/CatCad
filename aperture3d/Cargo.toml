[package]
name = "aperture3d"
description = "A small retained 3D scene renderer that draws into a palantir GpuView"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# The crates.io name carries the `3d` because `aperture` is taken; the library
# itself is `aperture`, which is what call sites import.
[lib]
name = "aperture"

[dependencies]
palantir.workspace = true
bytemuck.workspace = true
glam.workspace = true
wgpu.workspace = true

[dev-dependencies]
# For `headless_test_gpu`, which every test here leases its device from: the
# lease holds palantir's interprocess lock, so this crate's GPU section and
# catcad's cannot run at once under `cargo test --workspace`.
palantir = { workspace = true, features = ["internals"] }
# The allocation-test harness the `alloc` target below drives.
common = { workspace = true, features = ["internals"] }
# The crate on itself, to turn `internals` on for its own test targets and
# nowhere else. An integration test links the library built normally —
# `cfg(test)` is set only for the crate's own unit tests — so the reach-ins it
# needs have to arrive as a feature. Dev-dependency features are resolved only
# when building tests, which is what keeps them out of `cargo build` and out of
# what a consumer of this crate is given.
aperture3d = { path = ".", features = ["internals"] }

[features]
# The reach-ins a harness assembling a scene by hand needs and an application
# redrawing one does not: emptying a [`Batch`], shortening it, saying it was
# written to without writing to it, re-flattening with no frame to ask for one,
# and the pane that shows one scene and nothing else. Off by default, so what
# the crate publishes is the refill an app actually wants.
internals = []

# Its own target because `CountingAllocator` has to be *the* allocator of the
# binary that runs. Ordinary `#[test]` functions inside it, so cargo names each
# gate and runs them the way it runs the rest. No `required-features`: the
# `internals` it reaches through arrives from the dev-dependency above, so a
# bare `cargo test` runs the gates rather than silently skipping them.
[[test]]
name = "alloc"
path = "tests/alloc/main.rs"

[lints]
workspace = true
