[package]
name = "aperture3d"
description = "A small retained 3D scene renderer that draws into a palantir GpuView"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# The crates.io name carries the `3d` because `aperture` is taken; the library
# itself is `aperture`, which is what call sites import.
[lib]
name = "aperture"

[dependencies]
palantir.workspace = true
bytemuck.workspace = true
glam.workspace = true
wgpu.workspace = true
common = { workspace = true, optional = true }

[dev-dependencies]
# For `headless_test_gpu`, which the pipeline tests lease a device from. Not
# `HeadlessGpu`, which is published and would do: the lease holds palantir's
# interprocess lock, so this crate's GPU section and catcad's cannot run at
# once under `cargo test --workspace`.
palantir = { workspace = true, features = ["internals"] }

[features]
# Compiles the allocation-bench driver in `src/` and exposes the one call
# `tests/alloc.rs` makes. Off by default: nothing published depends on it.
# Carries `internals` because the driver stages scenes by hand, which is what
# that feature is for.
bench = ["dep:common", "common/bench", "internals"]

# The reach-ins a harness assembling a scene by hand needs and an application
# redrawing one does not: emptying a [`Batch`], shortening it, and saying it was
# written to without writing to it. Off by default, so what the crate publishes
# is the refill an app actually wants.
internals = []

# Its own target because `dhat::Alloc` has to be *the* global allocator, which
# is process-wide — anything sharing the binary pays a 10-30x allocator tax. A
# test rather than a bench because that isolation is per *binary*, and an
# integration test is one: what the bench profile bought was `lto = "fat"` and a
# single codegen unit, which cost a minute of build for a measurement that
# counts allocations rather than timing them.
[[test]]
name = "alloc"
harness = false
required-features = ["bench"]

[lints]
workspace = true
